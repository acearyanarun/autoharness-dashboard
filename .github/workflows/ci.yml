name: CI

# Phase 1 CI: tests the ingestion pipeline against fixtures. It never builds or runs Kani;
# the measurement workflow (explicit kani_ref / library_ref inputs) arrives in Phase 2.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install with dev extras
        run: python -m pip install -e '.[dev]'

      - name: Tests (includes the offline wheel-install tests)
        run: python -m pytest -rs

      - name: Installed package, run from outside the checkout
        # A normal (non-editable) install into a fresh venv, with its declared dependencies.
        # Proves config and schemas come from the package and jsonschema comes with it.
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv installed
          installed/bin/python -m pip install "$GITHUB_WORKSPACE"
          installed/bin/autoharness-data build \
            --listing "$GITHUB_WORKSPACE/tests/fixtures_small/all_variants.stdout.txt" \
            --run-meta "$GITHUB_WORKSPACE/tests/fixtures_small/run-meta.toml" \
            --out example-data
          installed/bin/autoharness-data verify --data example-data

      - name: Upload example data
        if: matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: example-data
          path: ${{ runner.temp }}/example-data
          retention-days: 7
